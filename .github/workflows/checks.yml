name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up virtual environment
        shell: powershell
        run: .\setup.ps1 -Python (Get-Command python).Source
      - name: Test application and PowerShell lifecycle
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem *.ps1, tests/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
